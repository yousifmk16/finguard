version: "3.9"

services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: finguard-backend
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env.example
    depends_on:
      - postgres
      - redis
      - broker

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: finguard-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: finguard-postgres
    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finguard-redis
    ports:
      - "6379:6379"

  broker:
    image: redpandadata/redpanda:v24.1.4
    container_name: finguard-broker
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://broker:9092
    ports:
      - "9092:9092"

volumes:
  postgres_data:
