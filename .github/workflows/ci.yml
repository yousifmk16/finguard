name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dev tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          else
            pip install ruff pytest
          fi

      - name: Run backend lint
        shell: bash
        run: |
          if [ -f backend/ruff.toml ]; then
            ruff check backend/app backend/tests
          else
            echo "No backend lint config found, skipping lint."
          fi

      - name: Run backend tests (placeholder-aware)
        shell: bash
        run: |
          if [ -d backend/tests ] && [ "$(find backend/tests -type f -name "test_*.py" | wc -l)" -gt 0 ]; then
            pytest backend/tests -q
          else
            echo "No backend tests found yet, skipping tests."
          fi

  ml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f ml/requirements.txt ]; then
            pip install -r ml/requirements.txt
          else
            pip install numpy pandas
          fi

      - name: Run ML feature pipeline tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          if [ -d ml/tests ] && [ "$(find ml/tests -type f -name "test_*.py" | wc -l)" -gt 0 ]; then
            pytest ml/tests -q
          else
            echo "No ML tests found yet, skipping tests."
          fi

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "No frontend package.json found, skipping install."
          fi

      - name: Run frontend lint (placeholder-aware)
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            if npm run | grep -q " lint"; then
              npm run lint
            else
              echo "No frontend lint script found, skipping lint."
            fi
          else
            echo "No frontend package.json found, skipping lint."
          fi

      - name: Run frontend tests (placeholder-aware)
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            if npm run | grep -q " test"; then
              npm test -- --watch=false
            else
              echo "No frontend test script found, skipping tests."
            fi
          else
            echo "No frontend package.json found, skipping tests."
          fi
